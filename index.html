<!DOCTYPE html>
<html>
<head>
    <title>Free JSON Validator Online | Validate JSON Instantly</title>

    <meta name="description" content="Free JSON Validator Online tool. Validate, check and format JSON instantly. Fast and secure JSON checker.">

    <meta name="keywords" content="json validator, validate json online, free json checker, json formatter, json validation tool">

    <meta name="author" content="YourBrandName">
</head>
<body>

<h1>JSON Validator</h1>

<textarea id="jsonInput" placeholder="Paste your JSON here..."></textarea>
<br>
<button onclick="validateJSON()">Validate</button>

<p id="result"></p>

<script>
function validateJSON() {
    let input = document.getElementById("jsonInput").value;
    let result = document.getElementById("result");

    try {
        JSON.parse(input);
        result.innerHTML = "✅ Valid JSON";
        result.style.color = "green";
    } catch (e) {
        result.innerHTML = "❌ Invalid JSON<br>" + e.message;
        result.style.color = "red";
    }
}
</script>

</body>
</html>
